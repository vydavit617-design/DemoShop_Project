{% extends 'admin/base_admin.html' %}{% block title %}Product form | DemoShop{% endblock %}{% block admin_content %}<form class="panel form-panel narrow" method="post" enctype="multipart/form-data"><h2>{{ 'Edit product' if product else 'Add new product' }}</h2><label>Product name<input name="name" required value="{{ product.name if product else '' }}"></label><label>Description<textarea name="description" rows="4" required>{{ product.description if product else '' }}</textarea></label><div class="two-fields"><label>Price (USD)<input type="number" name="price" min="0" step="0.01" required value="{{ product.price if product else '' }}"></label><label>Stock quantity<input type="number" name="stock" min="0" required value="{{ product.stock if product else '0' }}"></label></div><label>Product image<input type="file" name="image" accept="image/*"></label>{% if product and product.image %}<p class="muted">Current image: {{ product.image }}</p>{% endif %}<label class="check"><input type="checkbox" name="active" {% if not product or product.active %}checked{% endif %}> Active product</label><button class="btn full">Save product</button><a class="back" href="{{ url_for('admin_dashboard') }}">Cancel</a></form>{% endblock %}
