<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}DemoShop{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
<header class="topbar"><a class="brand" href="{{ url_for('home') }}">Demo<span>Shop</span></a><nav><a href="{{ url_for('home') }}">Shop</a><a href="{{ url_for('cart') }}">Cart <b class="count">{{ cart_count }}</b></a><a href="{{ url_for('admin_login') }}">Admin</a></nav></header>
<main class="container">{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>© 2026 DemoShop · Student project demonstration</footer></body></html>
